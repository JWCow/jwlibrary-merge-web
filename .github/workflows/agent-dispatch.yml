name: Autonomous Cloud Agent Dispatch

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Task description or instruction for the agent"
        required: true
        type: string
      issue_number:
        description: "Issue number (optional, e.g. 1)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent-runner:
    # Trigger if issue is labeled 'agent' or 'ready-for-agent', OR if an issue comment starts with '/agent', OR on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (
        (github.event.label != null && (github.event.label.name == 'agent' || github.event.label.name == 'ready-for-agent')) ||
        contains(github.event.issue.labels.*.name, 'ready-for-agent') ||
        contains(github.event.issue.labels.*.name, 'agent')
      )) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Agent Task Context
        id: prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK_PROMPT: ${{ github.event.inputs.task_prompt }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NUM="${INPUT_ISSUE_NUMBER:-manual}"
            TITLE="Manual Dispatch: $INPUT_TASK_PROMPT"
            PROMPT="$INPUT_TASK_PROMPT"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            NUM="$ISSUE_NUMBER"
            TITLE="$ISSUE_TITLE"
            COMMENT_PROMPT=$(echo "$COMMENT_BODY" | sed 's/^\/agent[[:space:]]*//')
            if [ -n "$COMMENT_PROMPT" ]; then
              PROMPT="$COMMENT_PROMPT"
            else
              PROMPT="$ISSUE_BODY"
            fi
          else
            NUM="$ISSUE_NUMBER"
            TITLE="$ISSUE_TITLE"
            PROMPT="$ISSUE_BODY"
          fi

          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "branch_name=agent/run-$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "agent_prompt<<AGENT_EOF" >> "$GITHUB_OUTPUT"
          echo "$PROMPT" >> "$GITHUB_OUTPUT"
          echo "AGENT_EOF" >> "$GITHUB_OUTPUT"

      - name: Acknowledge on Issue
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🤖 **Autonomous Cloud Agent Dispatched!**

          Running task on cloud runner (${{ github.run_id }}). I will inspect the code, execute edits, verify test suites, and open a Pull Request when complete."

      - name: Execute Autonomous Agent Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.prep.outputs.issue_title }}
          AGENT_PROMPT: ${{ steps.prep.outputs.agent_prompt }}
        run: |
          node scripts/cloud-agent-runner.mjs

      - name: Commit Changes & Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.prep.outputs.issue_title }}
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$BRANCH_NAME"
          
          # Check if any files were changed
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes were made by the agent."
            exit 0
          fi
          
          git add -A
          git commit -m "feat(agent): resolve issue #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
          git push origin "$BRANCH_NAME"
          
          SUMMARY=""
          if [ -f ".agent_pr_summary.md" ]; then
            SUMMARY=$(cat .agent_pr_summary.md)
          else
            SUMMARY="Autonomous agent completed implementation and verified with passing test suite."
          fi
          
          PR_BODY="## 🤖 Autonomous Agent Summary

          $SUMMARY

          ---
          Closes #${ISSUE_NUMBER}
          *Automated PR generated by Cloud Agent Dispatch on GitHub Actions.*"
          
          PR_URL=$(gh pr create \
            --title "feat(agent): ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base "master")
            
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR at $PR_URL"

      - name: Notify on Issue with PR Link
        if: github.event_name != 'workflow_dispatch' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ **Agent Work Completed & Verified!**

          I have opened a Pull Request for review:
          👉 **[Review & Merge Pull Request]($PR_URL)**

          All automated tests and build checks passed."
          
          # Adjust labels if gh supports it
          gh issue edit "$ISSUE_NUMBER" --remove-label "ready-for-agent" --add-label "ready-for-human" || true
