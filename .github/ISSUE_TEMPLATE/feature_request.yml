name: 💡 Feature Request
description: Suggest an idea or enhancement for the merger tool
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new features or improvements!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: How would this help?
      description: Explain the practical benefit for personal study or congregation preparation.
